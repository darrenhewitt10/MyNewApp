<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Spotlight</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07070d" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=2" />
</head>
<body>
  <div class="orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="auth-main">
    <a href="/" class="logo" aria-label="Spotlight home"><span class="logo-orb"></span>Spotlight</a>

    <section class="auth-card glass">
      <h1>Welcome to Spotlight</h1>
      <p class="auth-sub">Sign in with your Google account to see if AI assistants recommend your business.</p>

      <div class="provider-list">
        <button class="provider-btn" data-provider="google" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>
          Continue with Google
        </button>
      </div>

      <p class="auth-error" role="alert" hidden></p>
      <p class="auth-fine">By continuing you agree to Spotlight’s terms and privacy policy.</p>
    </section>

    <a href="/" class="auth-back">← Back to home</a>
  </main>

  <script type="module" src="/login.js?v=2"></script>
</body>
</html>
