<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Spotlight</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0a14" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <div class="beam" aria-hidden="true"></div>

  <main class="auth-main">
    <a href="/" class="logo auth-logo" aria-label="Spotlight home">
      <img class="logo-mark" src="/favicon.svg" alt="" />
      <span>Spotlight</span>
    </a>

    <section class="auth-card">
      <h1>Welcome to Spotlight</h1>
      <p class="auth-sub">Log in or create your account to see if AI assistants recommend your business.</p>

      <div class="provider-list">
        <button class="provider-btn" data-provider="google" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>
          Continue with Google
        </button>
        <button class="provider-btn" data-provider="apple" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.7c0-2.6 2.1-3.8 2.2-3.9a4.8 4.8 0 0 0-3.8-2c-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9a5 5 0 0 0-4.2 2.6c-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.6 1.3-.1 1.7-.8 3.3-.8 1.5 0 2 .8 3.3.8 1.4 0 2.2-1.3 3-2.5.9-1.4 1.3-2.8 1.3-2.8s-2.2-.9-2.2-4.2zM13.9 5c.7-.9 1.2-2 1-3.2-1 .1-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
          Continue with Apple (iCloud)
        </button>
        <button class="provider-btn" data-provider="custom:yahoo" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#6001D2"/><path fill="#fff" d="M5 7.5h2.9l1.7 4.3 1.7-4.3h2.8l-4.2 9.8H7.1l1.1-2.6zM15.3 7.5h3l-2.7 6.2h-3z"/><circle cx="14.3" cy="15.8" r="1.4" fill="#fff"/></svg>
          Continue with Yahoo
        </button>
      </div>

      <p class="auth-error" role="alert" hidden></p>
      <p class="auth-fine">By continuing you agree to Spotlight’s terms and privacy policy.</p>
    </section>

    <a href="/" class="auth-back">← Back to home</a>
  </main>

  <script type="module" src="/login.js"></script>
</body>
</html>
