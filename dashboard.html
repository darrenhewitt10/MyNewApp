<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Spotlight</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07070d" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav">
    <div class="nav-inner glass-strong">
      <a href="/" class="logo" aria-label="Spotlight home"><span class="logo-orb"></span>Spotlight</a>
      <div class="user-menu">
        <img class="avatar" alt="" hidden />
        <span class="user-name"></span>
        <button class="btn btn-ghost btn-sm" id="sign-out" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="dash" hidden>
    <div class="container">
      <div class="dash-head">
        <span class="eyebrow">Dashboard</span>
        <h1 class="dash-title">Hi <span class="first-name"></span> 👋</h1>
        <p class="lede">Add the business you want Spotlight to track. We’ll start asking AI assistants about it every week.</p>
      </div>

      <div class="dash-grid">
        <section class="dash-card glass">
          <h2>Add a business</h2>
          <form id="business-form" class="dash-form">
            <div class="field">
              <label for="b-name">Business name</label>
              <input id="b-name" name="name" type="text" placeholder="e.g. Rosa’s Taqueria" required maxlength="200" />
            </div>
            <div class="field">
              <label for="b-city">City</label>
              <input id="b-city" name="city" type="text" placeholder="e.g. Austin, TX" required maxlength="200" />
            </div>
            <button class="btn btn-primary" type="submit">Start tracking</button>
            <p class="form-msg" role="status" hidden></p>
          </form>
        </section>

        <section class="dash-card glass">
          <h2>Your businesses</h2>
          <ul class="biz-list"></ul>
          <p class="biz-empty">No businesses yet — add your first one.</p>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="/dashboard.js"></script>
</body>
</html>
